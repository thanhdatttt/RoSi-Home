  /rooms/properties/{propertyId}:
    post:
      summary: Create a room in a property
      tags: [Rooms]
      parameters:
        - in: path
          name: propertyId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, baseRent]
              properties:
                name:
                  type: string
                baseRent:
                  type: integer
      responses:
        "201":
          description: Room created
    get:
      summary: List rooms in a property
      tags: [Rooms]
      parameters:
        - in: path
          name: propertyId
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
