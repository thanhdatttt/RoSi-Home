openapi: 3.0.3
info:
  title: RosiHome API
  version: 0.1.0
  description: >
    RosiHome property management system — REST API backend (Node.js/Express + TypeScript + Drizzle + Supabase Postgres).
    This document serves as the source of truth for the Frontend.
servers:
  - url: /api/v1
    description: Current API version (v1)

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: Unauthorized
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: Forbidden
    NotFound:
      description: Not Found
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: Not Found
    ValidationError:
      description: Validation Error
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: Validation failed
              details:
                type: array
                items:
                  type: object

  schemas:
    PaginationMeta:
      type: object
      required: [page, pageSize, total]
      properties:
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer
    PropertyView:
      type: object
      required: [id, name, address, locality, createdAt, updatedAt, units, occupied]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        address:
          type: string
        locality:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        units:
          type: integer
        occupied:
          type: integer
    RoomView:
      type: object
      required: [id, propertyId, name, baseRent, status, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        propertyId:
          type: string
          format: uuid
        name:
          type: string
        baseRent:
          type: integer
        status:
          type: string
          enum: [Vacant, Occupied]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    UtilityRateView:
      type: object
      required: [id, propertyId, electricityRatePerKwh, waterBillingMethod, waterRatePerM3, waterFlatAmountPerTenant, effectiveFrom, createdBy, createdAt]
      properties:
        id: { type: string, format: uuid }
        propertyId: { type: string, format: uuid }
        electricityRatePerKwh: { type: integer, minimum: 0 }
        waterBillingMethod: { type: string, enum: [Metered, Flat] }
        waterRatePerM3: { type: integer, minimum: 0, nullable: true }
        waterFlatAmountPerTenant: { type: integer, minimum: 0, nullable: true }
        effectiveFrom: { type: string, format: date }
        createdBy: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
    SurchargeView:
      type: object
      required: [id, propertyId, name, monthlyAmount, effectiveFrom, effectiveTo, active, createdBy, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        propertyId: { type: string, format: uuid }
        name: { type: string }
        monthlyAmount: { type: integer, minimum: 0 }
        effectiveFrom: { type: string, format: date }
        effectiveTo: { type: string, format: date, nullable: true }
        active: { type: boolean }
        createdBy: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    TenantView:
      type: object
      required: [id, fullName, phone, email, idNumber, createdByLandlordId, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        fullName: { type: string }
        phone: { type: string }
        email: { type: string, format: email }
        idNumber: { type: string }
        createdByLandlordId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    LeaseView:
      type: object
      required: [id, roomId, roomName, propertyId, propertyName, tenantInfoId, tenantId, tenant, startDate, endDate, actualEndDate, agreedRent, deposit, status, createdBy, endedBy, endedAt, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        roomId: { type: string, format: uuid }
        roomName: { type: string }
        propertyId: { type: string, format: uuid }
        propertyName: { type: string }
        tenantInfoId: { type: string, format: uuid }
        tenantId: { type: string, format: uuid, nullable: true }
        tenant:
          type: object
          required: [fullName, phone, email]
          properties:
            fullName: { type: string }
            phone: { type: string }
            email: { type: string, format: email }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        actualEndDate: { type: string, format: date, nullable: true }
        agreedRent: { type: integer, minimum: 0 }
        deposit: { type: integer, minimum: 0 }
        status: { type: string, enum: [Active, Ended, Expired] }
        createdBy: { type: string, format: uuid }
        endedBy: { type: string, format: uuid, nullable: true }
        endedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    UpcomingExpirationView:
      type: object
      required: [leaseId, propertyId, propertyName, roomId, roomName, tenantFullName, endDate]
      properties:
        leaseId: { type: string, format: uuid }
        propertyId: { type: string, format: uuid }
        propertyName: { type: string }
        roomId: { type: string, format: uuid }
        roomName: { type: string }
        tenantFullName: { type: string }
        endDate: { type: string, format: date }
    LeaseReminderConfigView:
      type: object
      required: [propertyId, remindAt30Days, remindAt15Days, remindAt7Days]
      properties:
        propertyId: { type: string, format: uuid }
        remindAt30Days: { type: boolean }
        remindAt15Days: { type: boolean }
        remindAt7Days: { type: boolean }

security:
  - bearerAuth: []

paths:
  /health:
    get:
      summary: Health check endpoint
      tags:
        - System
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  service:
                    type: string
  /auth/register:
    post:
      summary: Register a new user
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fullName, email, password, passwordConfirmation]
              properties:
                fullName:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
                passwordConfirmation:
                  type: string
                  format: password
      responses:
        "200":
          description: OK
        "400":
          $ref: "#/components/responses/ValidationError"
  /auth/login:
    post:
      summary: Login
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                  description: Email or username
                password:
                  type: string
                  format: password
      responses:
        "200":
          description: Successfully logged in
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
                  refreshToken:
                    type: string
                  user:
                    type: object
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/refresh:
    post:
      summary: Refresh Access Token
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
  /auth/logout:
    post:
      summary: Logout
      tags: [Auth]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
      responses:
        "200":
          description: Successfully logged out
  /auth/change-password:
    post:
      summary: Change password
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword, newPasswordConfirmation]
              properties:
                currentPassword:
                  type: string
                  format: password
                newPassword:
                  type: string
                  format: password
                newPasswordConfirmation:
                  type: string
                  format: password
      responses:
        "200":
          description: Password changed successfully
  /auth/forgot-password:
    post:
      summary: Forgot password
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        "200":
          description: Reset link sent
  /profile:
    get:
      summary: Get current user profile
      tags: [Profile]
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  fullName:
                    type: string
                  email:
                    type: string
                  phone:
                    type: string
                  role:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      summary: Update user profile
      tags: [Profile]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fullName:
                  type: string
                phone:
                  type: string
      responses:
        "200":
          description: Profile updated
  /properties:
    get:
      summary: List all properties
      tags: [Properties]
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: pageSize
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: A list of properties
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/PropertyView"
                  meta:
                    $ref: "#/components/schemas/PaginationMeta"
    post:
      summary: Create a property
      tags: [Properties]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, address, utilityRates]
              properties:
                name:
                  type: string
                address:
                  type: string
                locality:
                  type: string
                utilityRates:
                  type: object
                  required: [electricityRatePerKwh, waterBillingMethod]
                  properties:
                    electricityRatePerKwh:
                      type: integer
                    waterBillingMethod:
                      type: string
                      enum: [Metered, Flat]
                    waterRatePerM3:
                      type: integer
                    waterFlatAmountPerTenant:
                      type: integer
                surcharges:
                  type: array
                  description: Optional initial surcharges for this property. These will be effective from the current date.
                  items:
                    type: object
                    required: [name, monthlyAmount]
                    properties:
                      name:
                        type: string
                      monthlyAmount:
                        type: integer
      responses:
        "201":
          description: Property created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/PropertyView"
  /properties/{id}:
    get:
      summary: Get property details
      tags: [Properties]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Property details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/PropertyView"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      summary: Update property
      tags: [Properties]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                address:
                  type: string
                locality:
                  type: string
      responses:
        "200":
          description: Property updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/PropertyView"
  /properties/{propertyId}/lease-reminder-config:
    get:
      summary: Get lease reminder config for a property
      tags: [Properties]
      parameters:
        - in: path
          name: propertyId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Reminder config
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/LeaseReminderConfigView"
    patch:
      summary: Update lease reminder config
      tags: [Properties]
      parameters:
        - in: path
          name: propertyId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              additionalProperties: false
              properties:
                remindAt30Days: { type: boolean }
                remindAt15Days: { type: boolean }
                remindAt7Days: { type: boolean }
      responses:
        "200":
          description: Config updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/LeaseReminderConfigView"
  /rooms/properties/{propertyId}:
    post:
      summary: Create a room in a property
      tags: [Rooms]
      parameters:
        - in: path
          name: propertyId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, baseRent]
              properties:
                name:
                  type: string
                baseRent:
                  type: integer
      responses:
        "201":
          description: Room created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/RoomView"
    get:
      summary: List rooms in a property
      tags: [Rooms]
      parameters:
        - in: path
          name: propertyId
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: pageSize
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: A list of rooms
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/RoomView"
                  meta:
                    $ref: "#/components/schemas/PaginationMeta"
  /rooms/properties/{propertyId}/bulk:
    post:
      summary: Bulk create rooms
      tags: [Rooms]
      parameters:
        - in: path
          name: propertyId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rooms]
              properties:
                rooms:
                  type: array
                  items:
                    type: object
                    required: [name, baseRent]
                    properties:
                      name:
                        type: string
                      baseRent:
                        type: integer
      responses:
        "201":
          description: Rooms created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      created:
                        type: array
                        items:
                          $ref: "#/components/schemas/RoomView"
  /rooms/{id}:
    get:
      summary: Get room details
      tags: [Rooms]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Room details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/RoomView"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      summary: Update room
      tags: [Rooms]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                baseRent:
                  type: integer
      responses:
        "200":
          description: Room updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/RoomView"
  /tenants:
    get:
      summary: List all tenants
      tags: [Tenants]
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: pageSize
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: A list of tenants
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/TenantView"
                  meta:
                    $ref: "#/components/schemas/PaginationMeta"
  /tenants/{id}:
    get:
      summary: Get tenant details
      tags: [Tenants]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Tenant details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/TenantView"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      summary: Update tenant
      tags: [Tenants]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fullName:
                  type: string
                phone:
                  type: string
                email:
                  type: string
                  format: email
                idNumber:
                  type: string
      responses:
        "200":
          description: Tenant updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/TenantView"
    delete:
      summary: Archive tenant
      tags: [Tenants]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Tenant archived
  /utilities/properties/{propertyId}/utility-rates:
    get:
      summary: Get utility rates for a property
      tags: [Utilities]
      parameters:
        - in: path
          name: propertyId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Utility rates containing both current and upcoming rates
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      current:
                        allOf:
                          - $ref: "#/components/schemas/UtilityRateView"
                        nullable: true
                      upcoming:
                        allOf:
                          - $ref: "#/components/schemas/UtilityRateView"
                        nullable: true
    post:
      summary: Set or update upcoming utility rates
      tags: [Utilities]
      parameters:
        - in: path
          name: propertyId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [electricityRatePerKwh, waterBillingMethod, effectiveFrom]
              properties:
                electricityRatePerKwh:
                  type: integer
                waterBillingMethod:
                  type: string
                  enum: [Metered, Flat]
                waterRatePerM3:
                  type: integer
                waterFlatAmountPerTenant:
                  type: integer
                effectiveFrom:
                  type: string
                  format: date
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/UtilityRateView"
  /utilities/properties/{propertyId}/utility-rates/{id}:
    delete:
      summary: Cancel an upcoming utility rate
      tags: [Utilities]
      parameters:
        - in: path
          name: propertyId
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Upcoming utility rate cancelled
  /charges/properties/{propertyId}/surcharges:
    get:
      summary: List surcharges
      tags: [Charges]
      parameters:
        - in: path
          name: propertyId
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: pageSize
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: A list of surcharges
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        current:
                          allOf:
                            - $ref: "#/components/schemas/SurchargeView"
                          nullable: true
                        upcoming:
                          allOf:
                            - $ref: "#/components/schemas/SurchargeView"
                          nullable: true
                  meta:
                    $ref: "#/components/schemas/PaginationMeta"
    post:
      summary: Create surcharge
      tags: [Charges]
      parameters:
        - in: path
          name: propertyId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, monthlyAmount, effectiveFrom]
              properties:
                name:
                  type: string
                monthlyAmount:
                  type: integer
                effectiveFrom:
                  type: string
                  format: date
                effectiveTo:
                  type: string
                  format: date
                  nullable: true
      responses:
        "201":
          description: Surcharge created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/SurchargeView"
  /charges/{id}:
    patch:
      summary: Update surcharge
      tags: [Charges]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                monthlyAmount:
                  type: integer
                effectiveFrom:
                  type: string
                  format: date
                effectiveTo:
                  type: string
                  format: date
                  nullable: true
      responses:
        "200":
          description: Surcharge updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/SurchargeView"
    delete:
      summary: Delete surcharge
      tags: [Charges]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Surcharge deleted
  /leases:
    post:
      summary: Create a new lease
      tags: [Leases]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roomId, tenant, startDate, endDate, agreedRent, deposit]
              properties:
                roomId:
                  type: string
                  format: uuid
                tenant:
                  type: object
                  required: [fullName, phone, idNumber, email]
                  properties:
                    fullName:
                      type: string
                    phone:
                      type: string
                    idNumber:
                      type: string
                    email:
                      type: string
                      format: email
                startDate:
                  type: string
                  format: date
                endDate:
                  type: string
                  format: date
                agreedRent:
                  type: integer
                deposit:
                  type: integer
      responses:
        "201":
          description: Lease created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/LeaseView"
                  meta:
                    type: object
                    required: [tenantAccountProvisioned]
                    properties:
                      tenantAccountProvisioned: { type: boolean }
                      tempPassword: { type: string }
    get:
      summary: List all leases
      tags: [Leases]
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: pageSize
          schema:
            type: integer
            default: 20
        - in: query
          name: propertyId
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: A list of leases
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/LeaseView"
                  meta:
                    $ref: "#/components/schemas/PaginationMeta"
