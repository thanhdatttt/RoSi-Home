        "200":
          description: A list of rooms
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                  meta:
                    $ref: "#/components/schemas/PaginationMeta"
  /rooms/properties/{propertyId}/bulk:
    post:
      summary: Bulk create rooms
      tags: [Rooms]
      parameters:
        - in: path
          name: propertyId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rooms]
              properties:
                rooms:
                  type: array
                  items:
                    type: object
                    required: [name, baseRent]
                    properties:
                      name:
                        type: string
                      baseRent:
                        type: integer
      responses:
        "201":
          description: Rooms created
  /rooms/{id}:
    get:
      summary: Get room details
