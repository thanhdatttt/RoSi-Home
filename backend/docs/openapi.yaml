  /rooms/{roomId}/meter-readings:
    get:
      summary: List active meter readings for an owned room
      tags: [Meters]
      parameters:
        - in: path
          name: roomId
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: billingPeriod
          schema:
            type: string
            pattern: '^\\d{4}-(0[1-9]|1[0-2])$'
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: pageSize
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Active meter readings, optionally filtered by billing period
    post:
      summary: Record a meter reading
      tags: [Meters]
      parameters:
        - in: path
          name: roomId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [utilityType, billingPeriod, value]
              properties:
                utilityType:
                  type: string
                  enum: [Electricity, Water]
                billingPeriod:
                  type: string
                  example: "2024-05"
                value:
                  type: number
                isInitial:
                  type: boolean
                  default: false
      responses:
        "201":
          description: Reading recorded
  /meter-readings/{id}/correct:
    post:
      summary: Correct a meter reading
      tags: [Meters]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties:
                value:
                  type: number
      responses:
        "200":
          description: Reading corrected
