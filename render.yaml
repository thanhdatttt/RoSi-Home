services:
  - type: web
    name: rosi-home-backend
    runtime: node
    rootDir: backend
    autoDeployTrigger: commit
    buildCommand: npm ci && npm run build && exit 1
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_PUBLIC_URL
        value: https://rosi-home.onrender.com
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
